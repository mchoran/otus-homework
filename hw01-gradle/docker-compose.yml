services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: demoDB
      POSTGRES_USER: usr
      POSTGRES_PASSWORD: pwd
    ports:
      - "5430:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usr -d demoDB"]
      interval: 2s
      timeout: 3s
      retries: 15
