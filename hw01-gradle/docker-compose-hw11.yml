services:
  postgres-hw11:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cacheDB
      POSTGRES_USER: usr
      POSTGRES_PASSWORD: pwd
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usr -d cacheDB"]
      interval: 2s
      timeout: 3s
      retries: 15
